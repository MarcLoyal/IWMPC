# Mission and vision, transcribed from the sign at the cooperative's office.
# Wording is the cooperative's own; only spelling and hyphenation were tidied
# (e.g. "iba't ibang", "oportunidad"). Do not reword without the cooperative.
vision_fil: >-
  Kooperatibang matatag at maunlad na may nagkakaisang mga kaanib, na may
  pagpapahalaga sa kalikasan, nagbibigay ng malinis na tubig, lumilikha ng
  trabaho, produkto at oportunidad na tutugon sa mga pangangailangan ng mga
  kasapi at ng buong komunidad.
mission_fil:
  - Gumawa ng mga programa para sa pag-aaral at pagsasanay para makahikayat ng mga bagong kaanib.
  - Makapagbigay ng malinis at mataas na kalidad na serbisyo na may pangangalaga sa kalikasan.
  - >-
    Magbigay ng malinis na tubig sa pamamagitan ng mga makabagong makinarya at
    teknolohiya sa pamamatnubay ng mga taong may kaalaman at malasakit para
    matugunan ang pangangailangan ng lahat na may buhay.
  - >-
    Makipag-ugnayan sa iba't ibang sangay ng pamahalaan na may kinalaman sa
    maayos na pamamalakad ng kooperatiba.

# Goals and objectives, transcribed from the second sign at the office.
goals_fil:
  - >-
    Pamahalaan ang kooperatiba na may iisang adhikain at prinsipyo para sa
    kapakanan ng mga miyembro at konsumidores na ang layunin ay tapat at
    malinis na pamamahala (transparency).
  - >-
    Makapaglingkod nang tapat at makatugon sa lahat ng pangangailangan at
    problema ng mga miyembro at konsumidores.
  - Makapagbahagi ng mga kaalaman sa lahat ng kabarangay tungkol sa kooperatiba at pagnenegosyo.
  - Makapangalap ng mga donasyon/grants at kaalaman para sa ikauunlad ng kooperatiba.
  - Maging kasangkapan o daan para sa mabuting pag-uusap ng mga miyembro at kabarangay.

# English versions are a working translation, NOT approved by the cooperative.
# Set translation_approved to true once they have reviewed it.
translation_approved: false
vision_en: >-
  A strong and progressive cooperative with united members that values the
  environment, provides clean water, and creates jobs, products and
  opportunities that answer the needs of its members and the whole community.
mission_en:
  - Create education and training programs to encourage new members to join.
  - Provide clean, high-quality service with care for the environment.
  - >-
    Provide clean water through modern machinery and technology, guided by
    knowledgeable and caring people, to meet the needs of all living things.
  - >-
    Coordinate with the different branches of government concerned with the
    proper management of the cooperative.
goals_en:
  - >-
    Manage the cooperative with one shared aim and set of principles, for the
    welfare of members and consumers, with honest and clean management
    (transparency) as the goal.
  - Serve honestly and respond to all the needs and problems of members and consumers.
  - Share knowledge about cooperatives and doing business with everyone in the barangay.
  - Gather donations, grants and knowledge for the cooperative's growth.
  - Be an instrument or channel for good dialogue between members and the barangay community.

# History, from the cooperative's "Kasaysayan ng IWMPC" document. One entry
# per row on the About page, oldest first; each row shows one photo beside its
# paragraphs. The Filipino text is the cooperative's own; the English is a
# working translation covered by translation_approved above.
history_fil:
  - - >-
      Nagsimula ang patubig sa Brgy. Inicbulan, Bauan, Batangas noong 1975.
      Ito ay kaloob ng pamahalaang lokal ng Bayan ng Bauan sa pamamagitan ni
      dating Punong Bayan Bienvinido C. Castillo, sa kahilingan ng tatlong
      magigiting na mga taga-barangay na sina CPA Crispin Rivera Jr., Col.
      Eustaquio Ilagan at Engr. Nemesio Marasigan.
  - - >-
      Ang unang bomba ng patubig ay itinayo sa loob ng bakuran ng Mababang
      Paaralan ng Inicbulan, at ang reservoir (concrete tank) ay itinayo sa
      gawing dulo ng barangay. Ang unang naging pangulo ng patubig ay si Acct.
      Crispin Rivera Jr. (1975–1990), sinundan ito ni Atty. Marlito I.
      Villanueva (1991–2001).
  - - >-
      Taong 2002 naman naging Pangulo si G. Reynaldo Marasigan at pinamahalaan
      niya ang Inicbulan Waterworks System (IWS). Una niyang ginawa ay gawing
      kooperatiba ang IWS. Ito ay nagkaroon ng katuparan nang ipagkaloob ng
      tanggapan ng Cooperative Development Authority (CDA) ang Certificate of
      Registration noong July 1, 2003, at pinangalanang Barangay Waterworks
      Service Cooperative (BWSC), na nagsimula lamang sa 37
      miyembro/cooperators na may paid-up capital na ₱37,000.00. Makalipas ang
      tatlong taon (2006), pina-amyendahan ang pangalang BWSC at ginawang
      Inicbulan Waterworks Multi-Purpose Cooperative.
    - >-
      Si G. Reynaldo Marasigan din ang unang naging Pangulo at Chairman of the
      Board ng IWMPC. Siya rin ang may-akda ng pagiging kooperatiba ng patubig
      ng Barangay Inicbulan. Sa panahon din ng kanyang pamumuno, nakabili ang
      kooperatiba ng isang parselang lupa na may sukat na 523 sq.m., at ito ay
      pinatayuan ng gusali para maging punong tanggapan ng kasalukuyang
      Inicbulan Waterworks Multi-Purpose Cooperative (IWMPC).
history_en:
  - - >-
      The water system of Brgy. Inicbulan, Bauan, Batangas began in 1975. It
      was a gift of the local government of the Municipality of Bauan through
      then Mayor Bienvinido C. Castillo, at the request of three dedicated
      residents of the barangay: CPA Crispin Rivera Jr., Col. Eustaquio Ilagan
      and Engr. Nemesio Marasigan.
  - - >-
      The first water pump was built inside the grounds of Inicbulan
      Elementary School, and the reservoir (concrete tank) was built at the far
      end of the barangay. The water system's first president was Acct.
      Crispin Rivera Jr. (1975–1990), followed by Atty. Marlito I. Villanueva
      (1991–2001).
  - - >-
      In 2002, Mr. Reynaldo Marasigan became President and took charge of the
      Inicbulan Waterworks System (IWS). His first step was to turn the IWS
      into a cooperative. This came true when the Cooperative Development
      Authority (CDA) granted its Certificate of Registration on July 1, 2003,
      under the name Barangay Waterworks Service Cooperative (BWSC), which
      started with just 37 members/cooperators and a paid-up capital of
      ₱37,000.00. Three years later (2006), the name BWSC was amended to
      Inicbulan Waterworks Multi-Purpose Cooperative.
    - >-
      Mr. Reynaldo Marasigan was also the first President and Chairman of the
      Board of IWMPC, and the author of the barangay water system becoming a
      cooperative. During his leadership, the cooperative bought a 523 sq.m.
      parcel of land and built on it the building that is now the main office
      of the Inicbulan Waterworks Multi-Purpose Cooperative (IWMPC).

# Cooperative profile, from the cooperative's document (written in English).
# The Filipino version is a working translation.
profile_en: >-
  The Inicbulan Waterworks Multi-Purpose Cooperative (IWMPC) is a
  community-centered cooperative based in Inicbulan, Bauan, Batangas,
  committed to providing essential services that promote the well-being and
  progress of its members and the community. Rooted in the values of
  cooperation, integrity, transparency, and service, IWMPC continuously works
  to deliver reliable and affordable water services while expanding its
  offerings to meet the evolving needs of the people. Through its water
  services, reasonably priced rice and LPG products, and loan programs, the
  cooperative aims to make everyday necessities and essential financial
  services more accessible to its members. Guided by responsible leadership
  and a shared vision of sustainable community development, IWMPC remains
  dedicated to building a stronger, more united, and self-reliant community.
profile_fil: >-
  Ang Inicbulan Waterworks Multi-Purpose Cooperative (IWMPC) ay isang
  kooperatibang nakatuon sa komunidad na nakabase sa Inicbulan, Bauan,
  Batangas, at nangangakong magbigay ng mahahalagang serbisyo para sa
  kapakanan at pag-unlad ng mga miyembro at ng komunidad. Nakaugat sa mga
  pagpapahalaga ng pagtutulungan, integridad, transparency at paglilingkod,
  patuloy na nagsisikap ang IWMPC na maghatid ng maaasahan at abot-kayang
  serbisyo sa tubig habang pinalalawak ang mga alok nito upang matugunan ang
  nagbabagong pangangailangan ng mga tao. Sa pamamagitan ng serbisyo sa
  tubig, abot-kayang bigas at LPG, at mga programa sa pautang, layunin ng
  kooperatiba na gawing mas abot-kamay ng mga miyembro ang mga pang-araw-araw
  na pangangailangan at mahahalagang serbisyong pinansyal. Ginagabayan ng
  responsableng pamumuno at ng iisang pananaw para sa napapanatiling pag-unlad
  ng komunidad, nananatiling tapat ang IWMPC sa pagbuo ng mas matatag, mas
  nagkakaisa at mas maaasahan-sa-sarili na komunidad.
