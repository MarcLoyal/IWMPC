# Mission and vision, transcribed from the sign at the cooperative's office.
# Wording is the cooperative's own; only spelling and hyphenation were tidied
# (e.g. "iba't ibang", "oportunidad"). Do not reword without the cooperative.
vision_fil: >-
  Kooperatibang matatag at maunlad na may nagkakaisang mga kaanib, na may
  pagpapahalaga sa kalikasan, nagbibigay ng malinis na tubig, lumilikha ng
  trabaho, produkto at oportunidad na tutugon sa mga pangangailangan ng mga
  kasapi at ng buong komunidad.
mission_fil:
  - Gumawa ng mga programa para sa pag-aaral at pagsasanay para makahikayat ng mga bagong kaanib.
  - Makapagbigay ng malinis at mataas na kalidad na serbisyo na may pangangalaga sa kalikasan.
  - >-
    Magbigay ng malinis na tubig sa pamamagitan ng mga makabagong makinarya at
    teknolohiya sa pamamatnubay ng mga taong may kaalaman at malasakit para
    matugunan ang pangangailangan ng lahat na may buhay.
  - >-
    Makipag-ugnayan sa iba't ibang sangay ng pamahalaan na may kinalaman sa
    maayos na pamamalakad ng kooperatiba.

# Goals and objectives, transcribed from the second sign at the office.
goals_fil:
  - >-
    Pamahalaan ang kooperatiba na may iisang adhikain at prinsipyo para sa
    kapakanan ng mga miyembro at konsumidores na ang layunin ay tapat at
    malinis na pamamahala (transparency).
  - >-
    Makapaglingkod nang tapat at makatugon sa lahat ng pangangailangan at
    problema ng mga miyembro at konsumidores.
  - Makapagbahagi ng mga kaalaman sa lahat ng kabarangay tungkol sa kooperatiba at pagnenegosyo.
  - Makapangalap ng mga donasyon/grants at kaalaman para sa ikauunlad ng kooperatiba.
  - Maging kasangkapan o daan para sa mabuting pag-uusap ng mga miyembro at kabarangay.

# English versions are a working translation, NOT approved by the cooperative.
# Set translation_approved to true once they have reviewed it.
translation_approved: false
vision_en: >-
  A strong and progressive cooperative with united members that values the
  environment, provides clean water, and creates jobs, products and
  opportunities that answer the needs of its members and the whole community.
mission_en:
  - Create education and training programs to encourage new members to join.
  - Provide clean, high-quality service with care for the environment.
  - >-
    Provide clean water through modern machinery and technology, guided by
    knowledgeable and caring people, to meet the needs of all living things.
  - >-
    Coordinate with the different branches of government concerned with the
    proper management of the cooperative.
goals_en:
  - >-
    Manage the cooperative with one shared aim and set of principles, for the
    welfare of members and consumers, with honest and clean management
    (transparency) as the goal.
  - Serve honestly and respond to all the needs and problems of members and consumers.
  - Share knowledge about cooperatives and doing business with everyone in the barangay.
  - Gather donations, grants and knowledge for the cooperative's growth.
  - Be an instrument or channel for good dialogue between members and the barangay community.
