# Photo collage at the top of the home page (right under the header).
# It is built from separate pictures so it stays readable on phones: each
# photo can be tapped to see it large, and each has its own description.
#
# To change a photo: put the new file in public/images/collage/ and point
# `image` at it. `focus` (top | center | bottom) says which part to keep when
# the tile crops the picture.
background: /images/collage/background-assembly.jpg

award:
  image: /images/awards/matatag-na-kooperatiba-2026-awarding.jpg
  width: 1600
  height: 1122
  alt_fil: "Tinatanggap ng IWMPC ang Matatag na Kooperatiba Award 2026 sa entablado, hawak ang tropeo at ang tseke."
  alt_en: "IWMPC receiving the Matatag na Kooperatiba Award 2026 on stage, holding the trophy and the cheque."

trophy:
  image: /images/awards/matatag-na-kooperatiba-2026-trophy.webp
  width: 749
  height: 900
  alt_fil: "Tropeo ng Matatag na Kooperatiba Award 2026: Inicbulan Waterworks Multipurpose Cooperative, 2nd Place, Outstanding Cooperative (Small Category)."
  alt_en: "Matatag na Kooperatiba Award 2026 trophy: Inicbulan Waterworks Multipurpose Cooperative, 2nd Place, Outstanding Cooperative (Small Category)."

