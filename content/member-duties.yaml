# Duties and responsibilities of members, from the cooperative's document.
# Both languages are the cooperative's own text.
intro_fil: >-
  Ang mga pangunahing tungkulin at responsibilidad ng bawat miyembro ng
  Inicbulan Waterworks Multi-Purpose Cooperative (IWMPC) ay nakabatay sa
  Republic Act No. 9520 (Philippine Cooperative Code of 2008) at sa By-Laws ng
  kooperatiba. Narito ang mga pangunahing gampanin ng isang aktibong miyembro:
intro_en: >-
  The primary duties and responsibilities of every member of the Inicbulan
  Waterworks Multi-Purpose Cooperative (IWMPC) are based on Republic Act No.
  9520 (Philippine Cooperative Code of 2008) and the cooperative's By-Laws.
  Below are the key roles and responsibilities of an active cooperative member:
groups:
  - title_fil: Pinansyal na Tungkulin
    title_en: Financial Responsibilities
    items:
      - title_fil: Pagbabayad ng Share Capital
        title_en: Payment of Share Capital
        text_fil: >-
          Tungkulin ng miyembro na bayaran ang kanyang subscribed share capital
          sa takdang panahon at patuloy na magdagdag ng puhunan ayon sa
          napagkasunduan ng kooperatiba.
        text_en: >-
          Members are responsible for paying their subscribed share capital on
          time and continuously contributing additional capital as agreed upon
          by the cooperative.
      - title_fil: Pagbabayad ng Bayarin
        title_en: Payment of Obligations
        text_fil: >-
          Responsibilidad na magbayad sa tamang oras ng buwanang konsumo sa
          tubig at anumang utang o obligasyong pinansyal sa kooperatiba.
        text_en: >-
          Members must pay their monthly water consumption bills and any
          outstanding loans or financial obligations to the cooperative on
          time.
  - title_fil: Pakikilahok at Pagsunod
    title_en: Participation and Compliance
    items:
      - title_fil: Pagdalo sa General Assembly
        title_en: Attendance at the General Assembly
        text_fil: >-
          Mahalaga ang pagdalo at aktibong pakikilahok sa taunang General
          Assembly (Pangkalahatang Pagpupulong) at iba pang espesyal na pulong
          upang makaboto at makapagbigay ng suhestiyon.
        text_en: >-
          Members are encouraged to attend and actively participate in the
          Annual General Assembly and other special meetings to exercise their
          voting rights and share their suggestions and opinions.
      - title_fil: Pagtatangkilik sa Serbisyo
        title_en: Patronage of Cooperative Services
        text_fil: >-
          Tungkulin na tangkilikin at gamitin ang mga produkto at serbisyo ng
          kooperatiba (tulad ng serbisyo sa tubig).
        text_en: >-
          Members are encouraged to support and utilize the products and
          services offered by the cooperative, particularly its water services.
      - title_fil: Pagsunod sa Patakaran
        title_en: Compliance with Policies
        text_fil: >-
          Dapat sundin ang Articles of Cooperation, By-Laws, at lahat ng
          patakaran o resolusyong ipinapatupad ng Board of Directors.
        text_en: >-
          Members must abide by the Articles of Cooperation, By-Laws, and all
          policies, rules, and resolutions implemented by the Board of
          Directors.
  - title_fil: Pangangalaga sa Komunidad at Kooperatiba
    title_en: Community and Cooperative Stewardship
    items:
      - title_fil: Pag-aalaga sa Pasilidad
        title_en: Care of Facilities
        text_fil: >-
          Responsibilidad ng miyembro na ingatan ang metro ng tubig at mga
          linya nito, at agad na i-report sa opisina kung may tagas (leak) o
          sira.
        text_en: >-
          Members are responsible for properly maintaining and protecting their
          water meters and service connections. Any leaks, damages, or
          irregularities must be reported immediately to the cooperative
          office.
      - title_fil: Pakikilahok sa Pagsasanay
        title_en: Participation in Trainings
        text_fil: >-
          Dumalo sa mga Pre-Membership Education Seminar (PMES) at iba pang
          pagsasanay upang mas lumalim ang kaalaman sa pagpapalakad ng
          kooperatiba.
        text_en: >-
          Members are encouraged to attend the Pre-Membership Education Seminar
          (PMES) and other cooperative training programs to enhance their
          knowledge and understanding of cooperative principles, operations,
          and management.
