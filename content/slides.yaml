# Photo slideshow at the top of the home page (right under the header).
# Put image files in public/slides/ and list them here, in order.
# When you replace a picture, give the new file a new name: browsers and the
# image cache keep serving the old picture under an old name.
# Landscape images around 1600 × 960 px work best. With one slide the arrows
# and dots hide themselves.
# `background` (optional) is the picture shown behind and around a slide.
# Without it, a blurred copy of the slide itself is used.
slides:
  - image: /slides/iwmpc-collage-v3.jpg
    width: 1600
    height: 1164
    background: /slides/background-assembly.jpg
    alt_fil: "Collage ng IWMPC na may apat na hanay. Unang hanay: ang logo ng kooperatiba, ang pagtanggap ng Matatag na Kooperatiba Award 2026 sa entablado, at ang tropeo (2nd Place, Outstanding Cooperative, Small Category). Ikalawang hanay: ang mga kawani sa opisina, ang mga tauhang teknikal, pagkukumpuni ng linya ng tubig, at ang harap ng opisina. Ikatlong hanay: mga miyembro sa General Assembly, ang Pre-Membership Education Seminar, mga nagtapos sa seminar na may sertipiko, at isang pulong. Ikaapat na hanay: serbisyo sa komunidad, pamimigay ng regalo, pagdiriwang ng Cooperative Month, at isang pangkatang larawan sa Inicbulan Elementary School."
    alt_en: "IWMPC collage in four rows. First row: the cooperative's logo, receiving the Matatag na Kooperatiba Award 2026 on stage, and the trophy (2nd Place, Outstanding Cooperative, Small Category). Second row: the office staff, the technical crew, water line work, and the front of the office. Third row: members at the General Assembly, the Pre-Membership Education Seminar, seminar graduates holding certificates, and a meeting. Fourth row: community service, gift-giving, the Cooperative Month celebration, and a group photo at Inicbulan Elementary School."
